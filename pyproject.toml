[project]
name = "mw-ha-tuya-integration"
version = "0.3.0"
description = "MW Tuya Integration — integração híbrida Local & Cloud multi-conta com seleção granular de dispositivos e cenas para o Home Assistant"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["custom_components", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"scripts/*" = ["E501", "T201", "E701", "E702", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
